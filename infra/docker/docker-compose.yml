services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: st_risk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python
    environment:
      UAV_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/st_risk
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  node-backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/st_risk
      PYTHON_BACKEND_URL: http://python-backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - python-backend

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - node-backend

volumes:
  pgdata:
