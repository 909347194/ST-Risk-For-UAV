# ============================================================================
# 宏观案例研究配置 (Macro Case Study Configuration)
# ============================================================================
# 用于城市级实证研究的真实/准真实数据场景
# 场景：5km x 5km 城市区域，真实或半真实数据

experiment:
    name: "urban_case_study"
    description: "城市级实证研究 - 宏观航路规划"
    type: "synthetic" # 可切换为 "real" 使用真实数据

# --------------------------------------------------------------------------
# 1. 空间网格配置
# --------------------------------------------------------------------------
spatial_grid:
    x_min: 0.0
    x_max: 5000.0
    y_min: 0.0
    y_max: 5000.0
    z_min: 0.0
    z_max: 120.0
    resolution_xy: 50.0 # 水平分辨率 (m)
    resolution_z: 10.0 # 垂直分辨率 (m)

# 计算得到的网格维度
grid_dims:
    nx: 100 # (5000-0)/50
    ny: 100 # (5000-0)/50
    nz: 12 # (120-0)/10

# --------------------------------------------------------------------------
# 2. 时间配置
# --------------------------------------------------------------------------
temporal:
    total_hours: 24 # 24小时模拟
    dt_minutes: 15 # 15分钟时间片 (适合宏观4D时间推进)
    nt: 96 # 时间步数 (24*4)

# --------------------------------------------------------------------------
# 3. 真实数据源配置 (当type="real"时使用)
# --------------------------------------------------------------------------
real_data_sources:
    # WorldPop人口数据
    population:
        source: "WorldPop"
        resolution: "100m"
        file_pattern: "*population*.tif"

    # OSM POI数据
    poi:
        source: "OpenStreetMap"
        format: "GeoJSON"
        file_pattern: "*poi*.geojson"

    # 土地利用数据
    landuse:
        source: "OSM/Local"
        format: "Shapefile"
        file_pattern: "*landuse*.shp"

    # 建筑数据
    building:
        source: "OSM/Local"
        format: "Shapefile"
        file_pattern: "*building*.shp"

    # ERA5气象数据
    weather:
        source: "ERA5"
        format: "NetCDF"
        wind_file: "*wind*.nc"
        rain_file: "*rain*.nc"
        temporal_resolution: "hourly"
        spatial_resolution: "0.25deg"

# --------------------------------------------------------------------------
# 4. 合成数据配置 (当type="synthetic"时使用)
# --------------------------------------------------------------------------
synthetic_config:
    seed: 42 # 随机种子
    city_type: "medium" # 城市类型: small/medium/large

    # 城市结构参数
    city_structure:
        cbd_center: [2500, 2500] # CBD中心位置
        cbd_radius: 800 # CBD半径 (m)
        residential_radius: 2000 # 住宅区外扩半径 (m)
        industrial_offset: 2500 # 工业区偏移 (m)

# --------------------------------------------------------------------------
# 5. OD对设计
# --------------------------------------------------------------------------
od_pairs:
    # 城市内部OD
    intra_city:
        - name: "commute_north_south"
          origin: [10, 50]
          destination: [90, 50]
          description: "南北通勤路径"

        - name: "commute_east_west"
          origin: [50, 10]
          destination: [50, 90]
          description: "东西通勤路径"

        - name: "diagonal"
          origin: [10, 10]
          destination: [90, 90]
          description: "对角线路径"

    # 跨区域OD
    cross_region:
        - name: "suburb_to_cbd"
          origin: [15, 15]
          destination: [50, 50]
          description: "郊区到CBD"

        - name: "cbd_to_airport"
          origin: [50, 50]
          destination: [90, 90]
          description: "CBD到机场方向"

# --------------------------------------------------------------------------
# 6. 实验设计
# --------------------------------------------------------------------------
experiments:
    # 实验1：潮汐效应分析
    tidal_analysis:
        description: "分析人口潮汐对路径的影响"
        time_slots:
            - hour: 0
              label: "凌晨"
            - hour: 6
              label: "清晨"
            - hour: 8
              label: "早高峰"
            - hour: 12
              label: "午间"
            - hour: 18
              label: "晚高峰"
            - hour: 22
              label: "夜间"

        algorithms: ["full_risk_astar", "eda_kmeans"]

    # 实验2：权重敏感性分析
    weight_sensitivity:
        description: "分析不同权重配置对路径的影响"
        presets: ["default", "emergency", "quiet_night", "strict_safety"]
        time_slots: [8, 12, 18, 22]

    # 实验3：算法效率对比
    algorithm_efficiency:
        description: "对比不同算法的效率和路径质量"
        algorithms:
            - name: "shortest_astar"
              use_risk: false
            - name: "full_risk_astar"
              use_risk: true
            - name: "eda_kmeans"
              use_risk: true
        repeat_times: 10 # 重复次数 (统计计算时间)

# --------------------------------------------------------------------------
# 7. 评估指标
# --------------------------------------------------------------------------
metrics:
    - name: "path_length"
      description: "路径长度 (m)"
      unit: "m"
    - name: "expected_risk"
      description: "期望风险 (积分)"
      unit: "无量纲"
    - name: "noise_cost"
      description: "噪声成本"
      unit: "dB"
    - name: "total_cost"
      description: "总成本 (加权和)"
      unit: "无量纲"
    - name: "computation_time"
      description: "计算时间"
      unit: "ms"
    - name: "population_exposure"
      description: "人口暴露量"
      unit: "人·m"
    - name: "risk_breakdown"
      description: "风险分项 (p_crash/fatality/property/noise)"
      unit: "各分项"

# --------------------------------------------------------------------------
# 8. 输出配置
# --------------------------------------------------------------------------
output:
    base_dir: "output/macro-case-study"
    save_paths: true
    save_tensors: false
    save_statistics: true
    plot_format: "png"
    plot_dpi: 300
    generate_report: true
