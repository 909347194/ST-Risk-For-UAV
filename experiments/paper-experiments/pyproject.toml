[project]
name = "paper-experiments"
version = "0.1.0"
description = "TD-RiskA* paper experiments: §3 Grid/State, §4 Risk Models, §5 Algorithm, §6 Case Study"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
full = [
    "scipy>=1.12",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
]
